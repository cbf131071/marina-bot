<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeos Exclusivos - Marina Alves</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.topo{
    padding:20px;
    text-align:center;
}

.topo h1{
    color:#ff4fa3;
}

.lista{
    padding:20px;
}

.video{
    margin-bottom:20px;
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
}

iframe{
    width:100%;
    height:500px;
    border:none;
}

.voltar{
    display:block;
    width:220px;
    margin:20px auto;
    text-align:center;
    padding:12px;
    border-radius:10px;
    background:#ff4fa3;
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="topo">
<h1>🎥 Vídeos Exclusivos</h1>
</div>

<div class="lista" id="videos"></div>

<a class="voltar" href="/area">Voltar</a>

<script>
fetch("/api/videos")
.then(r=>r.json())
.then(lista=>{

    const videos=document.getElementById("videos");

    lista.forEach(item=>{

        videos.innerHTML += `
        <div class="video">
            <h3>${item.name}</h3>
            <iframe src="/api/video/${item.id}"></iframe>
        </div>
        `;
    });

});
</script>

</body>
</html>
