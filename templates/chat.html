<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marina Alves</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Poppins',sans-serif}
        body{color:white}
        .screen{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:#000}
        .hidden{display:none!important}

        #loginScreen{
            width:100%;height:100%;
            background:
                linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 34%, rgba(0,0,0,0.10) 72%),
                url('/static/imagem_chat.jpeg');
            background-size:cover;background-position:center top;
            display:flex;justify-content:flex-end;align-items:center;flex-direction:column;
            padding:0 26px 26px;
        }

        .overlay-box{width:100%;background:rgba(0,0,0,0.30);border-radius:26px;padding:18px 18px 20px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(2px)}
        .welcome-script{font-family:'Great Vibes',cursive;font-size:52px;text-align:center;color:#ffd2ad;line-height:.9}
        .welcome-main{text-align:center;font-size:27px;color:#ffd9b9;margin-top:2px;font-weight:400}
        .line-heart{text-align:center;margin:7px 0 11px;color:#ff4b67;font-size:13px}
        .welcome-sub{text-align:center;font-size:14px;line-height:1.35;color:rgba(255,255,255,.94);margin-bottom:16px}
        .input-group{position:relative;margin-bottom:11px}
        .input-group input{width:100%;height:52px;border-radius:17px;border:1px solid rgba(255,255,255,.12);background:rgba(20,10,10,.72);color:white;padding:0 18px 0 44px;font-size:15px;outline:none}
        .input-group input::placeholder{color:rgba(255,255,255,.52)}
        .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.70;font-size:14px}
        .tip{text-align:center;font-size:12px;line-height:1.35;color:rgba(255,255,255,.78);margin-top:4px;margin-bottom:14px}
        .enter-btn{width:100%;height:58px;border:none;border-radius:22px;background:linear-gradient(135deg,#b8132c,#ff3d63);color:white;font-family:'Great Vibes',cursive;font-size:34px;cursor:pointer}

        #chatScreen{width:100%;height:100%;background:#0b0b0f;position:relative;overflow:hidden}
        .chat-header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:1000;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;min-height:84px;background:rgba(10,10,10,.98);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
        .avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;flex-shrink:0}
        .header-info h2{font-size:20px;font-weight:700;line-height:1.1}
        .status{color:#30ff69;font-size:14px;margin-top:4px}
        .messages{position:absolute;top:92px;left:0;right:0;bottom:86px;overflow-y:auto;padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
        .msg{max-width:80%;padding:16px 18px;border-radius:24px;line-height:1.45;font-size:16px;word-wrap:break-word;animation:fadeIn .2s ease}
        .msg.bot{background:#232326;align-self:flex-start;border-bottom-left-radius:8px}
        .msg.user{background:linear-gradient(135deg,#7c3aed,#9333ea);align-self:flex-end;border-bottom-right-radius:8px}
        .input-area{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:999;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(11,11,15,.99);border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;backdrop-filter:blur(12px)}
        .input-area input{flex:1;height:58px;border:none;outline:none;border-radius:20px;background:#19191d;color:white;padding:0 18px;font-size:17px;min-width:0}
        .input-area input::placeholder{color:rgba(255,255,255,.42)}
        .send-btn{width:82px;border:none;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#9333ea);color:white;font-size:17px;font-weight:600;cursor:pointer;flex-shrink:0}

        @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

        @media(max-width:480px){
            .screen,.chat-header,.input-area{max-width:100%}
            .welcome-script{font-size:50px}
            .welcome-main{font-size:26px}
            .msg{font-size:15px}
        }
    </style>
</head>

<body>
<div class="screen">

    <div id="loginScreen">
        <div class="overlay-box">
            <div class="welcome-script">Bem vindo</div>
            <div class="welcome-main">ao meu cantinho</div>
            <div class="line-heart">♡</div>
            <div class="welcome-sub">
                Para a gente conversar tranquilo<br>
                sem ser incomodado ❤️
            </div>

            <div class="input-group">
                <div class="input-icon">♡</div>
                <input type="text" id="nomeInput" placeholder="Seu nome ou apelido" autocomplete="off">
            </div>

            <div class="input-group">
                <div class="input-icon">⌕</div>
                <input type="text" id="codigoInput" placeholder="Um código pra eu lembrar de você" autocomplete="off">
            </div>

            <div class="tip">
                Use sempre o mesmo nome e código quando voltar ❤️
            </div>

            <button class="enter-btn" onclick="entrarChat()">Entrar no meu cantinho</button>
        </div>
    </div>

    <div id="chatScreen" class="hidden">
        <div class="chat-header" id="chatHeader">
            <img src="/static/marina.jpeg" class="avatar">
            <div class="header-info">
                <h2>Marina Alves</h2>
                <div class="status" id="statusText">online agora</div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area" id="inputArea">
            <input type="text" id="messageInput" placeholder="Mensagem..." autocomplete="off">
            <button class="send-btn" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

</div>

<script>
let userId = null;
let nomeUsuario = '';
let codigoUsuario = '';
let enviando = false;

let cutucadaTimer1 = null;
let cutucadaTimer2 = null;
let cutucadasEnviadas = 0;
let ultimaAtividadeUsuario = Date.now();

const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const messages = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const inputArea = document.getElementById('inputArea');
const statusText = document.getElementById('statusText');

window.onload = () => {
    localStorage.removeItem('marina_auto_login');
    ajustarTecladoMobile();
};

function esperar(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function tempoAntesDeDigitar(){
    return Math.floor(Math.random() * (15000 - 5000 + 1)) + 5000;
}

function tempoCutucada1(){
    return Math.floor(Math.random() * (30000 - 22000 + 1)) + 22000;
}

function tempoCutucada2(){
    return Math.floor(Math.random() * (80000 - 65000 + 1)) + 65000;
}

function saudacaoLocal(){
    const hora = new Date().getHours();

    if(hora >= 5 && hora < 12) return 'bom dia';
    if(hora >= 12 && hora < 18) return 'boa tarde';
    if(hora >= 18 && hora < 24) return 'boa noite';

    return 'tu acordado essa hora';
}

function limparNome(nome){
    if(!nome) return 'meu amor';

    const primeiroNome = nome.trim().split(' ')[0];

    return primeiroNome.charAt(0).toUpperCase() + primeiroNome.slice(1).toLowerCase();
}

function recepcaoInicial(nome){
    const nomeLimpo = limparNome(nome);
    const saudacao = saudacaoLocal();

    const frases = [
        `${saudacao}, ${nomeLimpo}… gostei que tu veio falar comigo`,
        `oi, ${nomeLimpo}… entra, fica comigo um pouco`,
        `${nomeLimpo}… gostei de te ver aqui comigo`,
        `${nomeLimpo}… agora sim, vem conversar comigo`,
        `oii, ${nomeLimpo}… chegou bem aqui`,
        `${nomeLimpo}, adorei que tu apareceu`,
        `oi, ${nomeLimpo}… gostei que tu entrou no meu cantinho`,
        `${nomeLimpo}… tava esperando tu aparecer por aqui`,
        `oi, ${nomeLimpo}… fica comigo um pouco`,
        `${nomeLimpo}… tu chegou e já melhorou isso aqui`
    ];

    return frases[Math.floor(Math.random() * frases.length)];
}

function entrarChat(){
    const nome = document.getElementById('nomeInput').value.trim();
    const codigo = document.getElementById('codigoInput').value.trim();

    if(!nome || !codigo){
        alert('Preenche teu nome e um código ❤️');
        return;
    }

    nomeUsuario = nome;
    codigoUsuario = codigo;
    cutucadasEnviadas = 0;
    ultimaAtividadeUsuario = Date.now();

    limparCutucadas();
    messages.innerHTML = '';

    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');

    primeiraMensagem();

    setTimeout(() => {
        messageInput.focus();
        ajustarTecladoMobile();
    }, 300);
}

async function primeiraMensagem(){
    await esperar(900);
    mostrarDigitando();
    await esperar(900);
    removerDigitando();

    const textoRecepcao = recepcaoInicial(nomeUsuario);
    adicionarMensagem(textoRecepcao, 'bot');

    try{
        const response = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                mensagem:'[entrada automática no chat]'
            })
        });

        const data = await response.json();

        if(data && data.user_id){
            userId = data.user_id;
        }

    } catch(error){
        console.log('Erro ao registrar entrada automática:', error);
    }

    iniciarCutucadas();
}

function adicionarMensagem(texto, tipo){
    const div = document.createElement('div');

    div.classList.add('msg');
    div.classList.add(tipo);
    div.innerText = texto;

    messages.appendChild(div);
    scrollFinal();
}

function mostrarDigitando(){
    if(statusText){
        statusText.innerText = 'digitando...';
    }
}

function removerDigitando(){
    if(statusText){
        statusText.innerText = 'online agora';
    }
}

function scrollFinal(){
    setTimeout(() => {
        messages.scrollTop = messages.scrollHeight;
    }, 50);
}

function limparCutucadas(){
    if(cutucadaTimer1){
        clearTimeout(cutucadaTimer1);
        cutucadaTimer1 = null;
    }

    if(cutucadaTimer2){
        clearTimeout(cutucadaTimer2);
        cutucadaTimer2 = null;
    }
}

function iniciarCutucadas(){
    limparCutucadas();

    if(!chatScreen || chatScreen.classList.contains('hidden')) return;
    if(enviando) return;
    if(cutucadasEnviadas >= 2) return;

    cutucadaTimer1 = setTimeout(() => {
        enviarCutucada(1);
    }, tempoCutucada1());

    cutucadaTimer2 = setTimeout(() => {
        enviarCutucada(2);
    }, tempoCutucada2());
}

function textoCutucada(numero){
    const nome = limparNome(nomeUsuario);

    const primeiras = [
        `não vai mais falar comigo, ${nome}?`,
        'ficou quietinho aí?',
        'sumiu de mim?',
        'tá ocupado agora?',
        'me deixou aqui esperando?',
        'vai ficar só me olhando?'
    ];

    const segundas = [
        'ainda tá aí?',
        'volta aqui um pouquinho',
        'fiquei curiosa com teu silêncio',
        'tá tudo bem por aí?',
        'não some assim de mim',
        'vou ficar quietinha então… mas tô aqui'
    ];

    if(numero === 1){
        return primeiras[Math.floor(Math.random() * primeiras.length)];
    }

    return segundas[Math.floor(Math.random() * segundas.length)];
}

async function enviarCutucada(numero){
    if(enviando) return;
    if(!userId) return;
    if(!chatScreen || chatScreen.classList.contains('hidden')) return;
    if(document.hidden) return;

    const tempoSemUsuario = Date.now() - ultimaAtividadeUsuario;

    if(numero === 1 && tempoSemUsuario < 20000) return;
    if(numero === 2 && tempoSemUsuario < 60000) return;

    cutucadasEnviadas += 1;

    mostrarDigitando();
    await esperar(Math.floor(Math.random() * (2500 - 1200 + 1)) + 1200);
    removerDigitando();

    const texto = textoCutucada(numero);
    adicionarMensagem(texto, 'bot');

    try{
        await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:userId,
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                mensagem:`[cutucada automática enviada pela Marina: ${texto}]`
            })
        });
    } catch(error){
        console.log('Erro ao registrar cutucada:', error);
    }
}

async function enviarMensagem(){
    const texto = messageInput.value.trim();

    if(!texto || enviando) return;

    enviando = true;
    ultimaAtividadeUsuario = Date.now();
    cutucadasEnviadas = 0;
    limparCutucadas();

    adicionarMensagem(texto, 'user');
    messageInput.value = '';

    removerDigitando();

    await esperar(tempoAntesDeDigitar());

    mostrarDigitando();

    try{
        const response = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:userId,
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                mensagem:texto
            })
        });

        const data = await response.json();

        removerDigitando();

        if(data && data.resposta){
            adicionarMensagem(data.resposta, 'bot');
        } else {
            adicionarMensagem('me chama de novo… quero te responder direito', 'bot');
        }

    } catch(error){
        removerDigitando();
        adicionarMensagem('pera… me chama de novo', 'bot');

    } finally{
        enviando = false;
        ultimaAtividadeUsuario = Date.now();
        iniciarCutucadas();
    }
}

messageInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        e.preventDefault();
        enviarMensagem();
    }
});

messageInput.addEventListener('input', function(){
    ultimaAtividadeUsuario = Date.now();
    limparCutucadas();
});

messageInput.addEventListener('blur', function(){
    ultimaAtividadeUsuario = Date.now();
    iniciarCutucadas();
});

messageInput.addEventListener('focus', function(){
    ultimaAtividadeUsuario = Date.now();
    limparCutucadas();
});

document.addEventListener('visibilitychange', function(){
    if(document.hidden){
        limparCutucadas();
    } else {
        ultimaAtividadeUsuario = Date.now();
        iniciarCutucadas();
    }
});

function ajustarTecladoMobile(){
    if(!window.visualViewport) return;

    const ajustar = () => {
        const viewport = window.visualViewport;
        const alturaTeclado = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);

        if(inputArea){
            inputArea.style.bottom = alturaTeclado + 'px';
        }

        if(messages){
            const inputAltura = inputArea ? inputArea.offsetHeight : 86;
            messages.style.bottom = (inputAltura + alturaTeclado) + 'px';
        }

        scrollFinal();
    };

    window.visualViewport.addEventListener('resize', ajustar);
    window.visualViewport.addEventListener('scroll', ajustar);

    ajustar();
}
</script>

</body>
</html>
