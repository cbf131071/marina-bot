<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marina Alves</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Poppins',sans-serif}
        body{color:white}
        .screen{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:#000}
        .hidden{display:none!important}

        #chatScreen{width:100%;height:100%;background:#0b0b0f;position:relative;overflow:hidden}

        .chat-header{
            position:fixed;
            top:0;
            left:50%;
            transform:translateX(-50%);
            width:100%;
            max-width:430px;
            z-index:1000;
            display:flex;
            align-items:center;
            gap:14px;
            padding:calc(10px + env(safe-area-inset-top)) 16px 14px;
            min-height:84px;
            background:rgba(10,10,10,.98);
            border-bottom:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(12px);
        }

        .avatar{
            width:58px;
            height:58px;
            border-radius:50%;
            object-fit:cover;
            flex-shrink:0;
        }

        .header-info{
            flex:1;
            min-width:0;
        }

        .header-info h2{
            font-size:20px;
            font-weight:700;
            line-height:1.1;
        }

        .status{
            color:#30ff69;
            font-size:14px;
            margin-top:4px;
        }

        .logout-link{
            color:rgba(255,255,255,.68);
            text-decoration:none;
            font-size:12px;
            padding:8px 10px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.08);
            background:rgba(255,255,255,.04);
            flex-shrink:0;
        }

        .messages{
            position:absolute;
            top:92px;
            left:0;
            right:0;
            bottom:86px;
            overflow-y:auto;
            padding:18px 14px 24px;
            display:flex;
            flex-direction:column;
            gap:14px;
            scroll-behavior:smooth;
        }

        .msg{
            max-width:80%;
            padding:16px 18px;
            border-radius:24px;
            line-height:1.45;
            font-size:16px;
            word-wrap:break-word;
            animation:fadeIn .2s ease;
        }

        .msg.bot{
            background:#232326;
            align-self:flex-start;
            border-bottom-left-radius:8px;
        }

        .msg.user{
            background:linear-gradient(135deg,#7c3aed,#9333ea);
            align-self:flex-end;
            border-bottom-right-radius:8px;
        }

        .input-area{
            position:fixed;
            left:50%;
            transform:translateX(-50%);
            bottom:0;
            width:100%;
            max-width:430px;
            z-index:999;
            padding:12px 12px calc(12px + env(safe-area-inset-bottom));
            background:rgba(11,11,15,.99);
            border-top:1px solid rgba(255,255,255,.08);
            display:flex;
            gap:10px;
            backdrop-filter:blur(12px);
        }

        .input-area input{
            flex:1;
            height:58px;
            border:none;
            outline:none;
            border-radius:20px;
            background:#19191d;
            color:white;
            padding:0 18px;
            font-size:17px;
            min-width:0;
        }

        .input-area input::placeholder{
            color:rgba(255,255,255,.42);
        }

        .send-btn{
            width:82px;
            border:none;
            border-radius:20px;
            background:linear-gradient(135deg,#7c3aed,#9333ea);
            color:white;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            flex-shrink:0;
        }

        @keyframes fadeIn{
            from{opacity:0;transform:translateY(4px)}
            to{opacity:1;transform:translateY(0)}
        }

        @media(max-width:480px){
            .screen,.chat-header,.input-area{max-width:100%}
            .msg{font-size:15px}
            .logout-link{font-size:11px;padding:7px 9px}
        }
    </style>
</head>

<body>
<div class="screen">

    <div id="chatScreen">
        <div class="chat-header" id="chatHeader">
            <img src="/static/marina.jpeg" class="avatar">
            <div class="header-info">
                <h2>Marina Alves</h2>
                <div class="status" id="statusText">online agora</div>
            </div>
            <a href="/logout" class="logout-link">sair</a>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area" id="inputArea">
            <input type="text" id="messageInput" placeholder="Mensagem..." autocomplete="off">
            <button class="send-btn" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

</div>

<script>
let userId = "{{ user_id|default('', true) }}";
let nomeUsuario = "{{ nome|default('amor', true) }}";
let codigoUsuario = "{{ codigo_usuario|default('', true) }}";
let enviando = false;
let primeiraMensagemEnviada = false;

let cutucadaTimer1 = null;
let cutucadaTimer2 = null;
let cutucadasEnviadas = 0;
let ultimaAtividadeUsuario = Date.now();

const chatScreen = document.getElementById('chatScreen');
const messages = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const inputArea = document.getElementById('inputArea');
const statusText = document.getElementById('statusText');

window.onload = async () => {
    ajustarTecladoMobile();

    if(!userId || !nomeUsuario){
        await carregarSessao();
    }

    abrirChatLogado();
};

async function carregarSessao(){
    try{
        const response = await fetch('/api/sessao');

        if(response.status === 401){
            window.location.href = '/login';
            return;
        }

        const data = await response.json();

        if(data && data.logado){
            userId = data.user_id || userId;
            nomeUsuario = data.nome || nomeUsuario || 'amor';
            codigoUsuario = data.codigo_usuario || codigoUsuario || '';
        } else {
            window.location.href = '/login';
        }

    } catch(error){
        console.log('Erro ao carregar sessão:', error);
        window.location.href = '/login';
    }
}

function abrirChatLogado(){
    cutucadasEnviadas = 0;
    ultimaAtividadeUsuario = Date.now();

    limparCutucadas();
    messages.innerHTML = '';

    primeiraMensagem();

    setTimeout(() => {
        messageInput.focus();
        ajustarTecladoMobile();
        iniciarCutucadas();
    }, 300);
}

function esperar(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function tempoAntesDeDigitar(){
    return Math.floor(Math.random() * (15000 - 5000 + 1)) + 5000;
}

function tempoCutucada1(){
    return 15000;
}

function tempoCutucada2(){
    return 35000;
}

function saudacaoLocal(){
    const hora = new Date().getHours();

    if(hora >= 5 && hora < 12) return 'bom dia';
    if(hora >= 12 && hora < 18) return 'boa tarde';
    if(hora >= 18 && hora < 24) return 'boa noite';

    return 'tu acordado essa hora';
}

function limparNome(nome){
    if(!nome) return 'meu amor';

    const primeiroNome = nome.trim().split(' ')[0];

    return primeiroNome.charAt(0).toUpperCase() + primeiroNome.slice(1).toLowerCase();
}

function recepcaoInicial(nome){
    const nomeLimpo = limparNome(nome);
    const saudacao = saudacaoLocal();

    const frases = [
        `${saudacao}, ${nomeLimpo}… gostei que tu veio falar comigo`,
        `oi, ${nomeLimpo}… entra, fica comigo um pouco`,
        `${nomeLimpo}… gostei de te ver aqui comigo`,
        `${nomeLimpo}… agora sim, vem conversar comigo`,
        `oii, ${nomeLimpo}… chegou bem aqui`,
        `${nomeLimpo}, adorei que tu apareceu`,
        `oi, ${nomeLimpo}… gostei que tu entrou no meu cantinho`,
        `${nomeLimpo}… tava esperando tu aparecer por aqui`,
        `oi, ${nomeLimpo}… fica comigo um pouco`,
        `${nomeLimpo}… tu chegou e já melhorou isso aqui`
    ];

    return frases[Math.floor(Math.random() * frases.length)];
}

async function primeiraMensagem(){
    if(primeiraMensagemEnviada) return;
    primeiraMensagemEnviada = true;

    await esperar(900);
    mostrarDigitando();
    await esperar(900);
    removerDigitando();

    try{
        const response = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:userId,
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                mensagem:'[entrada automática no chat]'
            })
        });

        const data = await response.json();

        if(data && data.user_id){
            userId = data.user_id;
        }

        if(data && data.resposta){
            adicionarMensagem(data.resposta, 'bot');
        } else {
            adicionarMensagem(recepcaoInicial(nomeUsuario), 'bot');
        }

    } catch(error){
        console.log('Erro ao registrar entrada automática:', error);
        adicionarMensagem(recepcaoInicial(nomeUsuario), 'bot');
    }

    iniciarCutucadas();
}

function adicionarMensagem(texto, tipo){
    const div = document.createElement('div');

    div.classList.add('msg');
    div.classList.add(tipo);
    div.innerText = texto;

    messages.appendChild(div);
    scrollFinal();
}

function mostrarDigitando(){
    if(statusText){
        statusText.innerText = 'digitando...';
    }
}

function removerDigitando(){
    if(statusText){
        statusText.innerText = 'online agora';
    }
}

function scrollFinal(){
    setTimeout(() => {
        messages.scrollTop = messages.scrollHeight;
    }, 50);
}

function limparCutucadas(){
    if(cutucadaTimer1){
        clearTimeout(cutucadaTimer1);
        cutucadaTimer1 = null;
    }

    if(cutucadaTimer2){
        clearTimeout(cutucadaTimer2);
        cutucadaTimer2 = null;
    }
}

function iniciarCutucadas(){
    limparCutucadas();

    if(!chatScreen) return;
    if(enviando) return;
    if(cutucadasEnviadas >= 2) return;

    cutucadaTimer1 = setTimeout(() => {
        enviarCutucada(1);
    }, tempoCutucada1());

    cutucadaTimer2 = setTimeout(() => {
        enviarCutucada(2);
    }, tempoCutucada2());
}

function textoCutucada(numero){
    const nome = limparNome(nomeUsuario);

    const primeiras = [
        `não vai mais falar comigo, ${nome}?`,
        'ficou quietinho aí?',
        'sumiu de mim?',
        'tá ocupado agora?',
        'me deixou aqui esperando?',
        'vai ficar só me olhando?'
    ];

    const segundas = [
        'ainda tá aí?',
        'volta aqui um pouquinho',
        'fiquei curiosa com teu silêncio',
        'tá tudo bem por aí?',
        'não some assim de mim',
        'vou ficar quietinha então… mas tô aqui'
    ];

    if(numero === 1){
        return primeiras[Math.floor(Math.random() * primeiras.length)];
    }

    return segundas[Math.floor(Math.random() * segundas.length)];
}

async function enviarCutucada(numero){
    if(enviando) return;
    if(!userId) return;
    if(!chatScreen) return;
    if(document.hidden) return;

    const tempoSemUsuario = Date.now() - ultimaAtividadeUsuario;

    if(numero === 1 && tempoSemUsuario < 20000) return;
    if(numero === 2 && tempoSemUsuario < 60000) return;

    cutucadasEnviadas += 1;

    mostrarDigitando();
    await esperar(Math.floor(Math.random() * (2500 - 1200 + 1)) + 1200);
    removerDigitando();

    const texto = textoCutucada(numero);
    adicionarMensagem(texto, 'bot');

    try{
        await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:userId,
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                cutucada_automatica:true,
                tentativa:numero,
                mensagem:`[cutucada automática enviada pela Marina: ${texto}]`
            })
        });
    } catch(error){
        console.log('Erro ao registrar cutucada:', error);
    }
}

async function enviarMensagem(){
    const texto = messageInput.value.trim();

    if(!texto || enviando) return;

    enviando = true;
    ultimaAtividadeUsuario = Date.now();
    cutucadasEnviadas = 0;
    limparCutucadas();

    adicionarMensagem(texto, 'user');
    messageInput.value = '';

    removerDigitando();

    await esperar(tempoAntesDeDigitar());

    mostrarDigitando();

    try{
        const response = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:userId,
                nome:nomeUsuario,
                codigo_usuario:codigoUsuario,
                mensagem:texto
            })
        });

        if(response.status === 401){
            window.location.href = '/login';
            return;
        }

        const data = await response.json();

        removerDigitando();

        if(data && data.user_id){
            userId = data.user_id;
        }

        if(data && data.resposta){
            adicionarMensagem(data.resposta, 'bot');
        } else {
            adicionarMensagem('tô aqui contigo… me fala de novo', 'bot');
        }

    } catch(error){
        removerDigitando();
        adicionarMensagem('tô aqui contigo… tenta me mandar de novo', 'bot');

    } finally{
        enviando = false;
        ultimaAtividadeUsuario = Date.now();
        iniciarCutucadas();
    }
}

messageInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        e.preventDefault();
        enviarMensagem();
    }
});

messageInput.addEventListener('input', function(){
    ultimaAtividadeUsuario = Date.now();
});

document.addEventListener('visibilitychange', function(){
    if(document.hidden){
        limparCutucadas();
    } else {
        ultimaAtividadeUsuario = Date.now();
        iniciarCutucadas();
    }
});

function ajustarTecladoMobile(){
    if(!window.visualViewport) return;

    const ajustar = () => {
        const viewport = window.visualViewport;
        const alturaTeclado = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);

        if(inputArea){
            inputArea.style.bottom = alturaTeclado + 'px';
        }

        if(messages){
            const inputAltura = inputArea ? inputArea.offsetHeight : 86;
            messages.style.bottom = (inputAltura + alturaTeclado) + 'px';
        }

        scrollFinal();
    };

    window.visualViewport.addEventListener('resize', ajustar);
    window.visualViewport.addEventListener('scroll', ajustar);

    ajustar();
}
</script>

</body>
</html>
