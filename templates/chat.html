<body>

<div class="screen">

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="overlay-box">

            <div class="welcome-script">Bem vindo</div>
            <div class="welcome-main">ao meu cantinho</div>

            <div class="line-heart">♡</div>

            <div class="welcome-sub">
                Para a gente conversar tranquilo<br>
                sem ser incomodado ❤️
            </div>

            <div class="input-group">
                <div class="input-icon">♡</div>
                <input type="text" id="nomeInput" placeholder="Seu nome ou apelido">
            </div>

            <div class="input-group">
                <div class="input-icon">⌕</div>
                <input type="text" id="codigoInput" placeholder="Um código pra eu lembrar de você">
            </div>

            <div class="tip">
                Use sempre o mesmo nome e código quando voltar. ❤️
            </div>

            <button class="enter-btn" onclick="entrarChat()">
                Entrar no meu cantinho
            </button>

        </div>
    </div>

    <!-- CHAT -->
    <div id="chatScreen" class="hidden">

        <div class="chat-header">
            <img src="/static/marina.jpeg" class="avatar">

            <div class="header-info">
                <h2>Marina Alves</h2>
                <div class="status">online agora</div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Mensagem..."
                autocomplete="off"
            >

            <button class="send-btn" onclick="enviarMensagem()">
                Enviar
            </button>
        </div>

    </div>

</div>

<script>

let userId = null;
let nomeUsuario = '';
let codigoUsuario = '';

const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const messages = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');

window.onload = () => {
    localStorage.removeItem('marina_auto_login');
};

function entrarChat() {

    const nome = document.getElementById('nomeInput').value.trim();
    const codigo = document.getElementById('codigoInput').value.trim();

    if (!nome || !codigo) {
        alert('Preenche teu nome e um código ❤️');
        return;
    }

    nomeUsuario = nome;
    codigoUsuario = codigo;

    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');

    primeiraMensagem();

    setTimeout(() => {
        messageInput.focus();
    }, 300);
}

async function primeiraMensagem() {

    const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            nome: nomeUsuario,
            codigo_usuario: codigoUsuario,
            mensagem: 'oi'
        })
    });

    const data = await response.json();

    userId = data.user_id;

    adicionarMensagem(data.resposta, 'bot');
}

function adicionarMensagem(texto, tipo) {

    const div = document.createElement('div');

    div.classList.add('msg');
    div.classList.add(tipo);

    div.innerText = texto;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}

async function enviarMensagem() {

    const texto = messageInput.value.trim();

    if (!texto) return;

    adicionarMensagem(texto, 'user');

    messageInput.value = '';

    const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            user_id: userId,
            nome: nomeUsuario,
            codigo_usuario: codigoUsuario,
            mensagem: texto
        })
    });

    const data = await response.json();

    adicionarMensagem(data.resposta, 'bot');
}

messageInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        enviarMensagem();
    }
});

</script>
