<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marina Alves</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:#fff;
}

.hero{
    min-height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.65)
    ),
    url('/static/home_marina.jpg');

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
}

.overlay{
    width:100%;
    max-width:500px;
    padding:35px 25px 40px;
}

.logo{
    font-family:'Great Vibes',cursive;
    color:#ff5c95;
    font-size:82px;
    text-align:center;
    line-height:1;
    margin-top:10px;
}

.welcome{
    margin-top:240px;
    text-align:center;
}

.welcome h1{
    font-size:38px;
    font-weight:800;
    line-height:1.1;
    margin-bottom:18px;
}

.btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    padding:20px;
    border-radius:22px;
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.btn-primary{
    background:linear-gradient(135deg,#ff4b7d,#ff79ad);
    color:white;
    box-shadow:0 0 25px rgba(255,105,155,.35);
}

.btn-secondary{
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.12);
    color:white;
}

.info{
    margin-top:25px;
    text-align:center;
}

.info p{
    font-size:18px;
    line-height:1.7;
    color:#ffffffee;
}

.warning{
    margin-top:28px;
    text-align:center;
}

.warning .adult{
    font-size:22px;
    font-weight:700;
    color:#ff7aa8;
    margin-bottom:10px;
}

.warning .safe{
    color:#ddd;
    font-size:15px;
}

@media(max-width:480px){

.logo{
    font-size:74px;
}

.welcome{
    margin-top:210px;
}

.welcome h1{
    font-size:34px;
}

.info p{
    font-size:17px;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="overlay">

<div class="logo">
Marina Alves
</div>

<div class="welcome">

<h1>
Bem-vindo ao meu cantinho
</h1>

<a href="/cadastro" class="btn btn-primary">
CRIAR MINHA CONTA
</a>

<a href="/login" class="btn btn-secondary">
JÁ TENHO CONTA
</a>

</div>

<div class="info">

<p>
Aqui você encontra conversas exclusivas comigo, fotos especiais, vídeos inéditos e novidades que não compartilho em nenhum outro lugar.
</p>

</div>

<div class="warning">

<div class="adult">
🔥 Conteúdo exclusivo para maiores de 18 anos
</div>

<div class="safe">
🔒 Ambiente privado e seguro
</div>

</div>

</div>

</section>

</body>
</html>
