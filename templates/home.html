<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marina Alves</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

.hero{

    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.70)
    ),
    url('/static/home_marina.png');

    background-size:100% auto;
    background-position:center top;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
}

.overlay{
    width:100%;
    max-width:520px;
    padding:20px 25px 50px;
}

.logo{

    font-family:'Great Vibes',cursive;
    color:#ff5c95;

    font-size:76px;
    line-height:0.85;

    text-align:center;

    margin-top:10px;

    margin-bottom:250px;

    text-shadow:0 0 20px rgba(255,92,149,.35);

}

.welcome{
    text-align:center;
}

.welcome h1{

    font-size:32px;
    line-height:1.1;
    font-weight:800;

    color:#fff;

    margin-bottom:25px;

    text-shadow:
    0 2px 15px rgba(0,0,0,.9);

}

.btn{

    display:block;
    width:100%;

    text-decoration:none;
    text-align:center;

    padding:22px;

    border-radius:28px;

    font-size:18px;
    font-weight:700;

}

.btn-primary{

    background:linear-gradient(
        135deg,
        #ff4f84,
        #ff7fb2
    );

    color:white;

    box-shadow:
    0 0 25px rgba(255,92,149,.4);

    margin-bottom:18px;

}

.btn-secondary{

    background:rgba(0,0,0,.70);

    color:white;

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(8px);

    margin-bottom:35px;

}

.info{

    text-align:center;
    margin-bottom:25px;

}

.info p{

    font-size:18px;
    line-height:1.7;

    color:white;

    text-shadow:
    0 2px 12px rgba(0,0,0,.8);

}

.warning{

    text-align:center;

}

.adult{

    color:#ff6ca5;

    font-size:24px;
    font-weight:800;

    line-height:1.3;

    margin-bottom:12px;

    text-shadow:
    0 2px 12px rgba(0,0,0,.8);

}

.safe{

    color:#f1f1f1;
    font-size:16px;

}

@media(max-width:480px){

.hero{

    background-size:100% auto;
    background-position:center top;

}

.logo{

    font-size:72px;

    margin-top:15px;

    margin-bottom:230px;

}

.welcome h1{

    font-size:30px;

    margin-bottom:22px;

}

.btn{

    padding:22px;

    font-size:17px;

}

.info p{

    font-size:16px;

    line-height:1.7;

}

.adult{

    font-size:20px;

}

}

</style>
</head>

<body>

<section class="hero">

<div class="overlay">

<div class="logo">
Marina Alves
</div>

<div class="welcome">

<h1>
Bem-vindo ao meu cantinho
</h1>

<a href="/cadastro" class="btn btn-primary">
CRIAR MINHA CONTA
</a>

<a href="/login" class="btn btn-secondary">
JÁ TENHO CONTA
</a>

</div>

<div class="info">

<p>
Aqui você encontra conversas exclusivas comigo, fotos especiais, vídeos inéditos e novidades que não compartilho em nenhum outro lugar.
</p>

</div>

<div class="warning">

<div class="adult">
🔥 Conteúdo exclusivo para maiores de 18 anos
</div>

<div class="safe">
🔒 Ambiente privado e seguro
</div>

</div>

</div>

</section>

</body>
</html>
