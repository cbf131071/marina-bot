<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos Exclusivas - Marina Alves</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.topo{
    padding:20px;
    text-align:center;
}

.topo h1{
    color:#ff4fa3;
}

.galeria{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1c1c1c;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    display:block;
}

.voltar{
    display:block;
    width:220px;
    margin:20px auto;
    text-align:center;
    padding:12px;
    border-radius:10px;
    background:#ff4fa3;
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="topo">
<h1>📸 Fotos Exclusivas</h1>
</div>

<div class="galeria" id="galeria"></div>

<a class="voltar" href="/area">Voltar</a>

<script>
fetch("/api/fotos")
.then(r => r.json())
.then(lista => {

    const galeria = document.getElementById("galeria");

    lista.forEach(item => {

        galeria.innerHTML += `
        <div class="card">
            <img src="/api/imagem/${item.id}">
        </div>
        `;
    });

});
</script>

</body>
</html>
