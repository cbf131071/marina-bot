<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina Alves</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#0f0f0f;height:100vh;display:flex;justify-content:center;align-items:center;color:white;}
.chat-container{width:100%;max-width:430px;height:100vh;background:#151515;display:flex;flex-direction:column;}
.topo{padding:14px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:12px;background:#111;}
.foto{width:48px;height:48px;border-radius:50%;background:url('/static/marina.jpeg');background-size:cover;background-position:center;flex-shrink:0;}
.nome h1{font-size:17px;color:white;}
.nome span{color:#5cff87;font-size:13px;}
.mensagens{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}
.msg{padding:12px 14px;border-radius:18px;max-width:80%;line-height:1.4;font-size:15px;word-wrap:break-word;}
.user{align-self:flex-end;background:#7c3aed;}
.bot{align-self:flex-start;background:#262626;}
.digitando{align-self:flex-start;background:#262626;color:#aaa;padding:10px 14px;border-radius:18px;font-size:14px;display:none;}
.input-area{padding:15px;border-top:1px solid #2a2a2a;display:flex;gap:10px;background:#111;}
input{flex:1;background:#1d1d1d;border:none;outline:none;color:white;padding:14px;border-radius:14px;font-size:15px;}
button{border:none;background:#7c3aed;color:white;padding:0 20px;border-radius:14px;cursor:pointer;font-size:15px;transition:0.2s;}
button:hover{opacity:0.9;}
button:disabled{opacity:0.6;cursor:not-allowed;}
.nome-box{position:fixed;inset:0;background:#0f0f0f;display:flex;justify-content:center;align-items:center;z-index:999;}
.nome-content{width:90%;max-width:350px;background:#181818;padding:25px;border-radius:22px;display:flex;flex-direction:column;gap:15px;}
.nome-content h2{font-size:22px;}
.nome-content p{color:#aaa;line-height:1.5;}
</style>
</head>

<body>

<div class="nome-box" id="nomeBox">
    <div class="nome-content">
        <h2>Marina Alves ❤️</h2>
        <p>Como posso te chamar?</p>
        <input type="text" id="nomeInput" placeholder="Seu nome ou apelido">
        <button onclick="entrar()">Entrar</button>
    </div>
</div>

<div class="chat-container">
    <div class="topo">
        <div class="foto"></div>
        <div class="nome">
            <h1>Marina Alves</h1>
            <span id="status">online agora</span>
        </div>
    </div>

    <div class="mensagens" id="mensagens">
        <div class="digitando" id="digitando">Marina está digitando...</div>
    </div>

    <div class="input-area">
        <input type="text" id="mensagemInput" placeholder="Mensagem...">
        <button id="botaoEnviar" onclick="enviar()">Enviar</button>
    </div>
</div>

<script>
let user_id = localStorage.getItem("user_id") || null
let nome = localStorage.getItem("nome") || null

if (!sessionStorage.getItem("sessao_ativa")) {
    localStorage.removeItem("nome")
    localStorage.removeItem("user_id")
    nome = null
    user_id = null
}

const mensagens = document.getElementById("mensagens")
const digitando = document.getElementById("digitando")
const statusMarina = document.getElementById("status")
const botaoEnviar = document.getElementById("botaoEnviar")
const mensagemInput = document.getElementById("mensagemInput")
const nomeInput = document.getElementById("nomeInput")

if(nome){
    document.getElementById("nomeBox").style.display = "none"
}

function adicionarMensagem(texto, classe){
    const div = document.createElement("div")
    div.classList.add("msg")
    div.classList.add(classe)
    div.innerText = texto
    mensagens.insertBefore(div, digitando)
    mensagens.scrollTop = mensagens.scrollHeight
}

function mostrarDigitando(){
    digitando.style.display = "block"
    statusMarina.innerText = "digitando..."
    statusMarina.style.color = "#aaa"
    mensagens.scrollTop = mensagens.scrollHeight
}

function esconderDigitando(){
    digitando.style.display = "none"
    statusMarina.innerText = "online agora"
    statusMarina.style.color = "#5cff87"
}

function mensagemBoasVindas(){
    const opcoes = [
        `oii, ${nome} ❤️`,
        `que bom te ver por aqui, ${nome} ❤️`,
        `oi meu bem ❤️ tava quietinha por aqui`,
        `${nome}... gostei que você entrou 😌`,
        `hummm, ${nome}... gostei do teu nome ❤️`,
        `tava te esperando aparecer, ${nome} 😌`,
        `oii, ${nome}... chega mais um pouquinho 😌`
    ]

    return opcoes[Math.floor(Math.random() * opcoes.length)]
}

function entrar(){
    nome = nomeInput.value.trim()
    if(!nome) return

    localStorage.setItem("nome", nome)
    sessionStorage.setItem("sessao_ativa", "1")

    document.getElementById("nomeBox").style.display = "none"
    mensagemInput.focus()

    setTimeout(() => {
        mostrarDigitando()

        setTimeout(() => {
            esconderDigitando()
            adicionarMensagem(mensagemBoasVindas(), "bot")
            mensagemInput.focus()
        }, 2500 + Math.random() * 2500)

    }, 1000 + Math.random() * 2000)
}

function tempoAntesDigitando(){
    return Math.floor(Math.random() * 5000) + 1500
}

function tempoDigitando(resposta){
    let tempo = resposta.length * 55
    tempo += Math.floor(Math.random() * 3000) + 1500

    if(tempo < 3000) tempo = 3000
    if(tempo > 11000) tempo = 11000

    return tempo
}

async function enviar(){
    const texto = mensagemInput.value.trim()
    if(!texto) return

    adicionarMensagem(texto, "user")
    mensagemInput.value = ""
    botaoEnviar.disabled = true

    try{
        const resposta = await fetch("/api/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id:user_id,
                nome:nome,
                mensagem:texto
            })
        })

        const data = await resposta.json()
        user_id = data.user_id
        localStorage.setItem("user_id", user_id)

        setTimeout(() => {
            mostrarDigitando()

            setTimeout(() => {
                esconderDigitando()
                adicionarMensagem(data.resposta, "bot")
                botaoEnviar.disabled = false
                mensagemInput.focus()
            }, tempoDigitando(data.resposta))

        }, tempoAntesDigitando())

    }catch(erro){
        esconderDigitando()
        adicionarMensagem("ai... deu um errinho aqui 😮‍💨", "bot")
        botaoEnviar.disabled = false
        mensagemInput.focus()
    }
}

mensagemInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault()
        enviar()
    }
})

nomeInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault()
        entrar()
    }
})
</script>

</body>
</html>
